limit_req_zone $binary_remote_addr zone=birthday_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=birthday_forms:10m rate=3r/m;

server {
    listen 80;
    listen [::]:80;
    server_name birthday.heang.top;

    client_max_body_size 1m;

    location = /favicon.ico {
        return 302 /icon.svg;
    }

    location /api/auth/ {
        limit_req zone=birthday_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/support {
        limit_req zone=birthday_forms burst=2 nodelay;
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
